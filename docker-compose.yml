services:
  mongo:
    image: mongo:7
    container_name: carbon-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - carbon-network
    labels:
      - "carbon.project=carbon-labs"
      - "carbon.service=mongo"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-ghcr.io/maskedmatters/carbon/backend:latest}
    container_name: carbon-backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - CHROMIUM_IMAGE=${CHROMIUM_IMAGE:-lscr.io/linuxserver/chromium:latest}
      - CONTAINER_DNS=${CONTAINER_DNS:-1.1.1.3,1.0.0.3}
      - TZ=${TZ:-UTC}
      - HOST_VOLUMES_DIR=${HOST_VOLUMES_DIR:-${PWD}/volumes}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./volumes:/app/volumes
    networks:
      - carbon-network
    labels:
      - "carbon.project=carbon-labs"
      - "carbon.service=backend"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/maskedmatters/carbon/frontend:latest}
    container_name: carbon-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    networks:
      - carbon-network
    labels:
      - "carbon.project=carbon-labs"
      - "carbon.service=frontend"
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  carbon-network:
    name: carbon-network
